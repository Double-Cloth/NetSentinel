name: 缺陷报告
description: 记录复现输入、需求依据和回归结果。
title: '[Bug] '
labels: [bug]
body:
  - type: input
    id: traceability
    attributes:
      label: 关联需求与设计
      description: 填写 UC、US、规则、测试编号或文档条款，尚未关联时说明原因。
      placeholder: UC-xx / R-001 / TE-C03 / 文档路径与章节
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 版本与环境
      description: 提供提交号或版本、操作系统、Go/Node.js 版本和相关部署信息。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤与输入
      description: 提供最小复现步骤、授权脱敏日志或合成夹具，以及相关规则版本和解析参数。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与证据
      description: 可附错误码、脱敏日志或截图。
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: 修复与回归记录
      description: 修复时补充负责人、修复 PR、回归命令和实际结果。
