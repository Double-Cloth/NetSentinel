services:
  migrate:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    command: ["-migrate"]
    environment:
      NETSENTINEL_DATA_DIR: /data
    volumes:
      - netsentinel-data:/data
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment:
      NETSENTINEL_ADDR: 0.0.0.0:8080
      NETSENTINEL_DATA_DIR: /data
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - netsentinel-data:/data
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 15s

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "127.0.0.1:${NETSENTINEL_WEB_PORT:-8088}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  netsentinel-data:
